<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusVision | High-Performance Reverse Image Search</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .main-container {
            width: 100%;
            max-width: 800px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* Upload Dropzone */
        .dropzone {
            border: 2px dashed var(--border);
            border-radius: 0.75rem;
            padding: 2.5rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(15, 23, 42, 0.4);
            position: relative;
            overflow: hidden;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .dropzone input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .dropzone-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .dropzone-text {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .dropzone-text span {
            color: var(--primary);
            font-weight: 600;
        }

        /* Preview Container */
        .preview-container {
            margin-top: 1.5rem;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .preview-container img {
            max-height: 200px;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-top: 1.5rem;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: var(--border);
            cursor: not-allowed;
        }

        /* Results Section */
        .results-section {
            margin-top: 2.5rem;
            display: none;
        }

        .results-section h3 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
        }

        .result-card {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .result-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
        }

        .result-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        .result-info {
            padding: 0.75rem;
        }

        .result-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        .result-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .loader {
            display: none;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>NexusVision</h1>
        <p>Ultra-Fast C-Powered Reverse Image Search Engine</p>
    </header>

    <div class="main-container">
        <!-- Upload Form / Dropzone -->
        <div class="dropzone" id="dropzone">
            <div class="dropzone-icon">📁</div>
            <div class="dropzone-text">Drag & drop your image here, or <span>browse files</span></div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <!-- Image Preview -->
        <div class="preview-container" id="previewContainer">
            <img id="imagePreview" src="" alt="Upload Preview">
            <span id="fileName" style="color: var(--text-muted); font-size: 0.85rem;"></span>
        </div>

        <button class="btn" id="searchBtn" disabled>Search Similar Images</button>

        <div class="loader" id="loader">Processing through C matching core... Please wait.</div>

        <!-- Results Grid -->
        <div class="results-section" id="resultsSection">
            <h3>Matching Results</h3>
            <div class="results-grid" id="resultsGrid"></div>
        </div>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const fileNameElem = document.getElementById('fileName');
        const searchBtn = document.getElementById('searchBtn');
        const loader = document.getElementById('loader');
        const resultsSection = document.getElementById('resultsSection');
        const resultsGrid = document.getElementById('resultsGrid');

        let selectedFile = null;

        // Handle File Selection
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // Drag and Drop Events
        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropzone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropzone.classList.remove('dragover');
            }, false);
        });

        dropzone.addEventListener('drop', (e) => {
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Please upload a valid image file.');
                return;
            }
            selectedFile = file;
            fileNameElem.textContent = file.name;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                imagePreview.src = e.target.result;
                previewContainer.style.display = 'flex';
                searchBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        // Trigger Search via Python Backend -> C Binary
        searchBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('image', selectedFile);

            searchBtn.disabled = true;
            loader.style.display = 'block';
            resultsSection.style.display = 'none';

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (data.success) {
                    renderResults(data.matches);
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                console.error(err);
                alert('An error occurred while communicating with the server.');
            } finally {
                loader.style.display = 'none';
                searchBtn.disabled = false;
            }
        });

        function renderResults(matches) {
            resultsGrid.innerHTML = '';
            matches.forEach(match => {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <img src="${match.image_url}" alt="${match.title}">
                    <div class="result-info">
                        <div class="result-title">${match.title}</div>
                        <div class="result-meta">
                            <span>${match.source}</span>
                            <span>Score: ${match.similarity}%</span>
                        </div>
                    </div>
                `;
                resultsGrid.appendChild(card);
            });
            resultsSection.style.display = 'block';
        }
    </script>
</body>
</html>
