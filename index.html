<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusVision | Reverse Image Search</title>
    <!-- Links to external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>NexusVision</h1>
        <p>High-Performance C-Powered Reverse Image Search Engine</p>
    </header>

    <div class="main-container">
        <!-- Drag-and-Drop Upload Area -->
        <div class="dropzone" id="dropzone">
            <div class="dropzone-icon">📁</div>
            <div class="dropzone-text">Drag & drop your image here, or <span>browse files</span></div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <!-- Image Preview Container -->
        <div class="preview-container" id="previewContainer">
            <img id="imagePreview" src="" alt="Upload Preview">
            <span id="fileName"></span>
        </div>

        <!-- Search Trigger Button -->
        <button class="btn" id="searchBtn" disabled>Search Similar Images</button>

        <div class="loader" id="loader">Processing through C matching core... Please wait.</div>

        <!-- Matching Results Section -->
        <div class="results-section" id="resultsSection">
            <h3>Matching Results</h3>
            <div class="results-grid" id="resultsGrid"></div>
        </div>
    </div>

    <!-- Links to external JavaScript controller -->
    <script src="app.js"></script>
</body>
</html>
